name: Build APK

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Gradle wrapper JAR
        run: gradle wrapper --gradle-version=8.2 --distribution-type=bin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            mkdir -p app/signing
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/signing/release.jks
            echo "Keystore decoded."
          else
            echo "No signing secret — debug key will be used."
          fi
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soundcloud-rpc-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
